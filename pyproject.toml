[project]
name = "project-context"
version = "0.1.0"
description = "Context Lab: experimental companion to Context From First Principles. Observation-first instrument, deterministic fixtures, frozen run artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ernan Hughes" }]
dependencies = [
    "project-context-compiler @ git+https://github.com/ernanhughes/project-context-compiler.git@bc2bd54e7565153b6e6d9da7187cda614e9d78fc",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
contextlab = "project_context.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_context"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
